[project]
name = "nook-pipeline"
version = "0.1.0"
description = "nook-add: turn a furniture photo or model into a normalized nook library item"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fal-client>=0.7",
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=0.18",
    "trimesh>=4.5",
]

[project.scripts]
nook-add = "nook_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
